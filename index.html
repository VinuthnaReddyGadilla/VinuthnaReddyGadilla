<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Download</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #FF8DA1 0%, #BD0553 50%, #FF8DA1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(189, 5, 83, 0.3);
            text-align: center;
            border: 2px solid rgba(255, 141, 161, 0.3);
        }
        
        h1 {
            background: linear-gradient(45deg, #FF8DA1, #BD0553);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: bold;
        }
        
        .download-btn {
            background: linear-gradient(45deg, #ff6b9d, #ff8a50);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(189, 5, 83, 0.5);
            background: linear-gradient(45deg, #FF8DA1, #BD0553, #FF8DA1);
        }
        
        .info {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(255, 141, 161, 0.1), rgba(189, 5, 83, 0.05));
            border-radius: 15px;
            color: #BD0553;
            font-weight: 500;
            border: 1px solid rgba(255, 141, 161, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Resume Download</h1>
        <button class="download-btn" onclick="downloadResume()">
            Download Resume PDF
        </button>
        
        <div class="info">
            <p><strong>⚠️ Warning:</strong> Download at your own risk - you might just end up wanting to hire me! 😉</p>
        </div>
    </div>

    <script>
        function downloadResume() {
            try {
                // GitHub raw file URL format
                // Replace 'YOUR_USERNAME' with your actual GitHub username
                // Replace 'main' with your default branch name if different
                const githubRawUrl = 'https://raw.githubusercontent.com/VinuthnaReddyGadilla/VinuthnaReddyGadilla/main/Vinuthna_Gadilla_Resume.pdf';
                
                // Create a temporary download link
                const link = document.createElement('a');
                link.href = githubRawUrl;
                link.download = 'Vinuthna_Gadilla_Resume.pdf';
                link.target = '_blank';
                
                // Append to body, click, and remove
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                console.log('Download initiated successfully');
            } catch (error) {
                console.error('Download failed:', error);
                alert('Download failed. Please check the file URL and try again.');
            }
        }
        
        // Alternative function if you want to open in new tab instead of download
        function openResume() {
            const githubRawUrl = 'https://raw.githubusercontent.com/VinuthnaReddyGadilla/VinuthnaReddyGadilla/main/Vinuthna_Gadilla_Resume.pdf';
            window.open(githubRawUrl, '_blank');
        }
    </script>
</body>
</html>
